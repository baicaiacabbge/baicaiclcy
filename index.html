  <script src="https://webapi.amap.com/maps?v=2.0&key=c4165df92b1f624f44e932659ad0920e&plugin=AMap.GeoJSON,AMap.Text,AMap.Marker,AMap.BezierCurve,AMap.Polyline"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
      background-color: #0d141c;
    }

    :root {
      --page-bg: #0d141c;
      --text-main: #e0e8f0;
      --text-sub: #98a8b8;
      --text-shadow: rgba(0, 0, 0, 0.75);
      --accent: #e8a0b8;
      --accent-2: #8fcbe8;
      --glow: rgba(232, 160, 184, 0.5);
      --font-kai: 'LXGW WenKai', 'Noto Serif SC', 'Microsoft YaHei', serif;
    }

    /* 过渡层 */
    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d141c;
      user-select: none;
      pointer-events: none;
      animation: introAutoFade 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes introAutoFade {
      0%   { opacity: 0; }
      10%  { opacity: 1; }
      65%  { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    .intro-title {
      font-size: 22px;
      font-weight: 400;
      color: #e0e8f0;
      letter-spacing: 8px;
      text-indent: 8px;
      opacity: 0;
      font-family: var(--font-kai);
      animation: introTextIn 1.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    .intro-sub {
      font-size: 11px;
      color: #6b7a8a;
      letter-spacing: 4px;
      text-indent: 4px;
      opacity: 0;
      margin-top: 12px;
      animation: introTextIn 1.8s cubic-bezier(0.2, 0.8, 0.3, 1) 0.15s forwards;
    }

    @keyframes introTextIn {
      0%   { opacity: 0; transform: translateY(6px); filter: blur(4px); }
      40%  { opacity: 1; transform: translateY(0); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* 主内容 */
    #main-content {
      opacity: 0;
      animation: mainContentIn 1s cubic-bezier(0.2, 0.8, 0.3, 1) 1s forwards;
    }

    @keyframes mainContentIn {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }

    #amap-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
    }

    /* 手绘噪点纹理层 — 移动端性能优化：关闭噪点层 */
    #noise-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 3;
      pointer-events: none;
      opacity: 0.04;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.92 0 0 0 0 0.86 0 0 0 0 0.82 0 0 0 0.55 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
      background-repeat: repeat;
      background-size: 240px 240px;
    }

    #watermark-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 2;
      pointer-events: none;
      background-repeat: repeat;
      background-size: 180px 120px;
      user-select: none;
      will-change: transform, opacity;
      animation: watermarkDrift 60s linear infinite,
                 watermarkBreathe 12s ease-in-out infinite;
    }

    @keyframes watermarkDrift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-40px, -20px); }
      50%  { transform: translate(-80px, 0); }
      75%  { transform: translate(-40px, 20px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes watermarkBreathe {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }

    .amap-logo,
    .amap-copyright {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* 右上角信息面板 */
    .info-panel {
      position: fixed;
      right: 16px;
      top: 14px;
      z-index: 999;
      text-align: right;
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      pointer-events: none;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-shadow:
        0 1px 2px var(--text-shadow),
        0 0 6px var(--text-shadow);
    }

    .info-panel .info-line {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      line-height: 1.6;
    }

    .info-panel .info-line i {
      font-size: 13px;
      color: var(--text-sub);
      opacity: 0.85;
      flex-shrink: 0;
    }

    .info-panel .info-line span {
      white-space: nowrap;
    }

    .info-panel .info-ip {
      font-size: 12px;
      color: var(--text-main);
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    .info-panel .info-location {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
      margin-top: 2px;
    }

    .info-panel .info-code {
      font-size: 12px;
      color: var(--text-main);
      font-weight: 600;
      font-family: 'Consolas', 'Monaco', 'Menlo', monospace;
      letter-spacing: 0.5px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .info-panel .info-together {
      display: block;
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      line-height: 1.9;
      letter-spacing: 0.2px;
    }

    .info-panel .info-together .tg-line {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
    }

    .info-panel .info-together .tg-line i {
      font-size: 12px;
      color: var(--accent);
      opacity: 0.9;
      flex-shrink: 0;
    }

    .info-panel .info-together .tg-name {
      color: var(--text-main);
      font-weight: 500;
      margin-right: 4px;
      font-family: var(--font-kai);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .info-panel .info-together .tg-time {
      font-family: 'Consolas', 'Monaco', 'Menlo', monospace;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      font-weight: 600;
    }

    .bottom-right-stack {
      position: fixed;
      right: 16px;
      bottom: 14px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
      user-select: none;
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-shadow:
        0 1px 2px var(--text-shadow),
        0 0 6px var(--text-shadow);
    }

    /* ========== 音乐选择器 + 播放模式 ========== */
    .music-control-row {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px;
    }

    .music-selector {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .music-selector i {
      font-size: 13px;
      color: var(--text-sub);
      opacity: 0.85;
    }

    /* 歌单下拉框（自定义卡片式，不遮挡内容） */
    .music-selector-wrap {
      position: relative;
      pointer-events: auto;
    }

    .music-selector-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(30, 40, 50, 0.92);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      font-size: 11.5px;
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      user-select: none;
      white-space: nowrap;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-selector-trigger:hover {
      border-color: rgba(232, 160, 184, 0.6);
    }

    .music-selector-trigger .current-song {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .music-selector-trigger .arrow {
      font-size: 9px;
      color: var(--text-sub);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .music-selector-wrap.open .music-selector-trigger .arrow {
      transform: rotate(180deg);
    }

    /* 歌单面板 —— 从底部展开，不遮挡内容 */
    .music-panel {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      width: 220px;
      max-height: 260px;
      overflow-y: auto;
      background: rgba(20, 28, 38, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 6px;
      z-index: 1200;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px) scale(0.97);
      transform-origin: bottom right;
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
      pointer-events: auto;
    }

    .music-selector-wrap.open .music-panel {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .music-panel::-webkit-scrollbar {
      width: 5px;
    }
    .music-panel::-webkit-scrollbar-track {
      background: transparent;
    }
    .music-panel::-webkit-scrollbar-thumb {
      background: rgba(232, 160, 184, 0.4);
      border-radius: 3px;
    }
    .music-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(232, 160, 184, 0.7);
    }

    .music-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 4px;
    }

    .music-panel-header .title {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .music-panel-header .count {
      font-size: 10px;
      color: var(--text-sub);
      opacity: 0.7;
    }

    .music-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-main);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      user-select: none;
      position: relative;
    }

    .music-item:hover {
      background: rgba(232, 160, 184, 0.12);
    }

    .music-item.active {
      background: rgba(232, 160, 184, 0.18);
      color: var(--accent);
      font-weight: 600;
    }

    .music-item .idx {
      font-size: 10px;
      color: var(--text-sub);
      font-family: 'Consolas', 'Monaco', monospace;
      min-width: 16px;
      text-align: center;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .music-item.active .idx {
      color: var(--accent);
      opacity: 1;
    }

    .music-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .music-item .playing-icon {
      font-size: 10px;
      color: var(--accent);
      opacity: 0;
      flex-shrink: 0;
      animation: soundWave 1s ease-in-out infinite;
    }

    .music-item.active .playing-icon {
      opacity: 1;
    }

    @keyframes soundWave {
      0%, 100% { transform: scaleY(0.6); }
      50%      { transform: scaleY(1); }
    }

    /* 播放模式按钮 —— 改为文字版 */
    .play-mode-btn {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 26px;
      padding: 0 8px;
      border-radius: 6px;
      background: rgba(30, 40, 50, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-sub);
      font-size: 11px;
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .play-mode-btn:hover {
      border-color: rgba(232, 160, 184, 0.6);
      color: var(--text-main);
    }

    .play-mode-btn:active {
      transform: scale(0.94);
    }

    .play-mode-btn.mode-loop {
      color: var(--accent);
      border-color: rgba(232, 160, 184, 0.5);
    }

    .play-mode-btn.mode-single {
      color: var(--accent-2);
      border-color: rgba(143, 203, 232, 0.5);
    }

    .play-mode-btn.mode-shuffle {
      color: #c084fc;
      border-color: rgba(192, 132, 252, 0.5);
    }

    /* ========== 进度条 —— 手机端优化触摸区域 ========== */
    .progress-container {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 230px;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(20, 28, 38, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .progress-container.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
    }

    .progress-bar-wrap {
      flex: 1;
      height: 24px;
      background: transparent;
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
      touch-action: none;
      display: flex;
      align-items: center;
    }

    .progress-bar-wrap::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 8px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 4px;
      transition: height 0.15s ease, background 0.2s ease;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    .progress-bar-wrap:hover::before,
    .progress-bar-wrap.active::before {
      height: 10px;
      background: rgba(255, 255, 255, 0.16);
    }

    .progress-bar-fill {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 8px;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: 4px;
      pointer-events: none;
      transition: width 0.1s linear, height 0.15s ease;
      box-shadow: 0 0 8px rgba(232, 160, 184, 0.5);
      z-index: 1;
    }

    .progress-bar-wrap:hover .progress-bar-fill,
    .progress-bar-wrap.active .progress-bar-fill {
      height: 10px;
    }

    .progress-bar-fill::after {
      content: "";
      position: absolute;
      right: 0;
      top: 50%;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(232,160,184,0.6) 40%, transparent 70%);
      border-radius: 50%;
      transform: translate(50%, -50%);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .progress-bar-wrap:hover .progress-bar-fill::after,
    .progress-bar-wrap.active .progress-bar-fill::after {
      opacity: 1;
    }

    .progress-bar-thumb {
      position: absolute;
      top: 50%;
      width: 20px;
      height: 20px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.15s ease;
      pointer-events: none;
      box-shadow: 0 0 0 4px rgba(232, 160, 184, 0.35), 0 0 10px rgba(232, 160, 184, 0.8);
      z-index: 2;
    }

    .progress-bar-wrap:hover .progress-bar-thumb,
    .progress-bar-wrap.active .progress-bar-thumb {
      transform: translate(-50%, -50%) scale(1);
    }

    .progress-time {
      font-size: 10.5px;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      font-family: 'Consolas', 'Monaco', 'Menlo', monospace;
      white-space: nowrap;
      min-width: 34px;
      text-align: center;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    .progress-toggle {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-sub);
      font-size: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .progress-toggle:hover {
      background: rgba(232, 160, 184, 0.25);
      color: var(--text-main);
      border-color: var(--accent);
    }

    .progress-show-btn {
      pointer-events: auto;
      display: none;
      align-items: center;
      justify-content: center;
      height: 26px;
      padding: 0 10px;
      border-radius: 8px;
      background: rgba(20, 28, 38, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-sub);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      gap: 5px;
      white-space: nowrap;
    }

    .progress-show-btn.show {
      display: flex;
    }

    .progress-show-btn:hover {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .progress-show-btn:active {
      transform: scale(0.96);
    }

    .progress-show-btn i {
      font-size: 11px;
    }

    /* 音频按钮 */
    .audio-btn {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-sub);
      letter-spacing: 0.3px;
      transition: color 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    .audio-btn:hover {
      color: var(--text-main);
    }

    .audio-btn:active {
      transform: scale(0.96);
    }

    .audio-btn i {
      font-size: 13px;
      line-height: 1;
    }

    .audio-btn.playing i {
      color: var(--accent);
    }

    .audio-hint {
      font-size: 10.5px;
      color: var(--text-sub);
      opacity: 0;
      transition: opacity 0.4s ease;
      letter-spacing: 0.3px;
      pointer-events: none;
      white-space: nowrap;
    }

    .audio-hint.show {
      opacity: 0.75;
    }

    .custom-copyright {
      font-size: 12px;
      color: var(--text-main);
      font-weight: 600;
      letter-spacing: 0.4px;
      white-space: nowrap;
      text-align: right;
      line-height: 1.6;
    }

    .custom-copyright .time-text {
      display: block;
      color: var(--text-sub);
      font-weight: 500;
      font-size: 11.5px;
    }

    .map-weather {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;

    #live2d-widget {
      position: fixed;

<body>

  <script>
    (function() {
      // ============================================================
      // 接口配置
      // ============================================================
      const WEATHER_ENABLED = true;
      const WEATHER_KEY = '9e38f0bc62f8fe0d';
      const WEATHER_API = 'https://api.auth.top/api/weather';

      const IP_GET_API = 'https://api.auth.top/api/getip';
      const IP_INFO_API = 'https://api.auth.top/api/ip';
      const API_KEY = '9e38f0bc62f8fe0d';

      const AMAP_WS_KEY = '29f1e7dd767d16cbcbf777bfbcde8b54';

      const CITY_NANCHUAN = '南川区';
      const CITY_JIAXIANG = '嘉祥县';

      const NANCHUAN = [107.10, 29.15];
      const YANGTUN = [116.35, 35.4819];

      // ============================================================
      // 认识时长
      // ============================================================
      const TG_YOUYOU_START = new Date(2025, 6, 1, 0, 0, 0);
      const TG_LUOLUO_START = new Date(2026, 7, 2, 0, 0, 0);

      function formatTogether(startDate) {
        const now = new Date();
        let diff = now.getTime() - startDate.getTime();
        if (diff < 0) diff = 0;

        const totalDays = Math.floor(diff / 86400000);

        let years = now.getFullYear() - startDate.getFullYear();
        const thisYearAnniv = new Date(
          startDate.getFullYear() + years,
          startDate.getMonth(),
          startDate.getDate(),
          startDate.getHours(),
          startDate.getMinutes(),
          startDate.getSeconds()
        );
        if (now < thisYearAnniv) years--;

        let remainderMs;
        if (years >= 1) {
          const lastAnniv = new Date(
            startDate.getFullYear() + years,
            startDate.getMonth(),
            startDate.getDate(),
            startDate.getHours(),
            startDate.getMinutes(),
            startDate.getSeconds()
          );
          remainderMs = now.getTime() - lastAnniv.getTime();
        } else {
          remainderMs = diff;
        }

        const days = Math.floor(remainderMs / 86400000);
        const hours = Math.floor((remainderMs % 86400000) / 3600000);
        const minutes = Math.floor((remainderMs % 3600000) / 60000);
        const seconds = Math.floor((remainderMs % 60000) / 1000);

        if (years >= 1) {
          return `第${years}年 ${days}天 ${hours}时 ${minutes}分 ${seconds}秒`;
        }
        return `${totalDays}天 ${hours}时 ${minutes}分 ${seconds}秒`;
      }

      function updateTogether() {
        const youyouEl = document.getElementById('tgYouyou');
        const luoluoEl = document.getElementById('tgLuoluo');
        if (youyouEl) youyouEl.textContent = '· ' + formatTogether(TG_YOUYOU_START);
        if (luoluoEl) luoluoEl.textContent = '· ' + formatTogether(TG_LUOLUO_START);
      }

      updateTogether();
      setInterval(updateTogether, 1000);

      // ============================================================
      // 音乐播放器
      // ============================================================
      const bgAudio = document.getElementById('bgAudio');
      const audioBtn = document.getElementById('audioBtn');
      const audioLabel = document.getElementById('audioLabel');
      const audioIcon = document.getElementById('audioIcon');
      const audioHint = document.getElementById('audioHint');

      const musicSelectorWrap = document.getElementById('musicSelectorWrap');
      const musicSelectorTrigger = document.getElementById('musicSelectorTrigger');
      const currentSongName = document.getElementById('currentSongName');
      const musicPanel = document.getElementById('musicPanel');
      const musicListContainer = document.getElementById('musicListContainer');
      const musicCount = document.getElementById('musicCount');

      const playModeBtn = document.getElementById('playModeBtn');

      const progressContainer = document.getElementById('progressContainer');
      const progressBarWrap = document.getElementById('progressBarWrap');
      const progressBarFill = document.getElementById('progressBarFill');
      const progressBarThumb = document.getElementById('progressBarThumb');
      const currentTimeEl = document.getElementById('currentTime');
      const totalTimeEl = document.getElementById('totalTime');
      const progressToggle = document.getElementById('progressToggle');
      const progressShowBtn = document.getElementById('progressShowBtn');

      // ============================================================
      // 🎵 歌曲列表 —— 在这里添加你的歌曲（共 7 个位置）
      // ============================================================
      const PLAYLIST = [
        { name: '春娇与志明', src: 'https://videotourl.com/audio/1789783334993-4ab404a8-045a-480e-b109-638c0549c0a4.mp3' },
        { name: '富士山下', src: 'https://videotourl.com/audio/1789783406615-ba1f9216-a02b-4cfb-b554-0e5343d96688.mp3' },
        { name: '恋人', src: 'https://videotourl.com/audio/1789783455944-60e0ce74-64ab-4e90-a0c1-b2c637ab05f3.mp3' },
        { name: '海海海', src: 'https://videotourl.com/audio/1789783515415-c76e304a-fcce-40da-b081-05bf2ba307a6.mp3' },
        { name: '彩虹', src: 'https://videotourl.com/audio/1789783630720-b4f4f719-6fde-411c-8199-59fbe1f60b35.mp3' },
        { name: '刚好遇见你', src: 'https://videotourl.com/audio/1789785066150-c2a1f1e8-b406-435c-a8fa-22b0e6e71479.mp3' },   
        { name: '盛夏的果实', src: 'https://videotourl.com/audio/1790243256175-c5d31198-7d36-430b-9f3c-00a971dc2e67.mp3' },
        { name: 'NIGHTDANCER', src: 'https://videotourl.com/audio/1790243864669-9403b610-19ba-418a-8c85-72fc82e05895.mp3' },
        { name: '小半', src: 'https://videotourl.com/audio/1790244106395-2b39a56a-9b24-4109-8493-3bdd33d4cf0e.mp3' },
        { name: '可不可以', src: 'https://videotourl.com/audio/1789279614413-3c09a0fa-4925-471d-a0f9-db3403c741f8.mp3' }
      ];

      const validSongs = PLAYLIST.filter(s => s.name && s.src);

      let audioPlaying = false;
      let userPaused = false;
      let autoPlayAttempted = false;
      let currentSongIndex = 0;
      let isSeeking = false;
      let progressHidden = false;

      let playMode = 'loop';

      // ========== 初始化歌单 UI ==========
      function initMusicSelector() {
        musicListContainer.innerHTML = '';
        musicCount.textContent = validSongs.length + ' 首';

        if (validSongs.length === 0) {
          currentSongName.textContent = '暂无歌曲';
          return;
        }

        validSongs.forEach((song, index) => {
          const item = document.createElement('div');
          item.className = 'music-item' + (index === currentSongIndex ? ' active' : '');
          item.dataset.index = index;
          item.innerHTML = `
            <span class="idx">${String(index + 1).padStart(2, '0')}</span>
            <span class="name">${song.name}</span>
            <i class="fa-solid fa-volume-high playing-icon"></i>
          `;
          item.addEventListener('click', (e) => {
            e.stopPropagation();
            const wasPlaying = audioPlaying;
            loadSong(index, wasPlaying);
            closeMusicPanel();
          });
          musicListContainer.appendChild(item);
        });

        if (validSongs.length > 0) {
          currentSongIndex = 0;
          bgAudio.src = validSongs[0].src;
          currentSongName.textContent = validSongs[0].name;
        }
      }

      // ========== 更新歌单高亮 ==========
      function updateMusicListUI() {
        const items = musicListContainer.querySelectorAll('.music-item');
        items.forEach((item, index) => {
          if (index === currentSongIndex) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });
        if (validSongs[currentSongIndex]) {
          currentSongName.textContent = validSongs[currentSongIndex].name;
        }
      }

      // ========== 打开/关闭歌单面板 ==========
      function toggleMusicPanel() {
        musicSelectorWrap.classList.toggle('open');
      }
      function closeMusicPanel() {
        musicSelectorWrap.classList.remove('open');
      }

      musicSelectorTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleMusicPanel();
      });

      document.addEventListener('click', (e) => {
        if (!musicSelectorWrap.contains(e.target)) {
          closeMusicPanel();
        }
      });

      // ========== 加载歌曲 ==========
      function loadSong(index, autoPlay) {
        if (index < 0 || index >= validSongs.length) return;
        currentSongIndex = index;
        bgAudio.src = validSongs[index].src;
        bgAudio.load();
        updateMusicListUI();
        progressBarFill.style.width = '0%';
        progressBarThumb.style.left = '0%';
        currentTimeEl.textContent = '0:00';
        totalTimeEl.textContent = '0:00';
        if (autoPlay) {
          bgAudio.play().then(() => {
            updateAudioUI(true);
          }).catch(() => {
            updateAudioUI(false);
          });

        updatePlayModeUI();
      });

      function getNextIndex() {
        if (validSongs.length === 0) return 0;
        if (validSongs.length === 1) return 0;
        if (playMode === 'single') return currentSongIndex;
        if (playMode === 'shuffle') {
          let next = currentSongIndex;
          while (next === currentSongIndex) {
            next = Math.floor(Math.random() * validSongs.length);
          }
          return next;
        }
        return (currentSongIndex + 1) % validSongs.length;
      }

      function formatTime(seconds) {
        if (!isFinite(seconds) || seconds < 0) return '0:00';
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + ':' + String(s).padStart(2, '0');
      }

      function updateProgress() {
        if (isSeeking) return;
        if (!bgAudio.duration || !isFinite(bgAudio.duration)) {
          progressBarFill.style.width = '0%';
          progressBarThumb.style.left = '0%';
          currentTimeEl.textContent = '0:00';
          totalTimeEl.textContent = '0:00';
          return;
        }
        const percent = (bgAudio.currentTime / bgAudio.duration) * 100;
        progressBarFill.style.width = percent + '%';
        progressBarThumb.style.left = percent + '%';
        currentTimeEl.textContent = formatTime(bgAudio.currentTime);
        totalTimeEl.textContent = formatTime(bgAudio.duration);
      }

      bgAudio.addEventListener('timeupdate', updateProgress);
      bgAudio.addEventListener('loadedmetadata', updateProgress);

      function getPercentFromEvent(e) {
        const rect = progressBarWrap.getBoundingClientRect();
        let clientX;
        if (e.touches && e.touches.length) {
          clientX = e.touches[0].clientX;
        } else if (e.changedTouches && e.changedTouches.length) {
          clientX = e.changedTouches[0].clientX;
        } else {
          clientX = e.clientX;
        }
        const percent = (clientX - rect.left) / rect.width;
        return Math.max(0, Math.min(1, percent));
      }

      function seekToPercent(percent) {
        if (bgAudio.duration && isFinite(bgAudio.duration)) {
          bgAudio.currentTime = percent * bgAudio.duration;
          progressBarFill.style.width = (percent * 100) + '%';
          progressBarThumb.style.left = (percent * 100) + '%';
          currentTimeEl.textContent = formatTime(bgAudio.currentTime);

        const percent = getPercentFromEvent(e);
        seekToPercent(percent);

      progressBarWrap.addEventListener('pointermove', (e) => {

      async function fetchVisitorIP() {
        try {

            headers: {
              'Authorization': 'Bearer ' + API_KEY,
              'Content-Type': 'application/x-www-form-urlencoded'
            },

          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const ip = data.ip || (data.data && data.data.ip);
          if (data.code !== 0 || !ip) return null;
          return ip;
        } catch (err) {
          return null;
        }
      }

      async function fetchIPLocation(ip) {
        try {
          const res = await fetch(IP_INFO_API, {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + API_KEY,
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: 'ip=' + encodeURIComponent(ip) + '&format=json'
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (data.code !== 0) return null;
          const loc = data.data || data;
          return {
            country: loc.country || '',
            province: loc.province || '',
            city: loc.city || ''
          };
        } catch (err) {
          return null;
        }
      }

      function buildLocationText(loc) {
        if (!loc) return '';
        const parts = [];
        if (loc.country) parts.push(loc.country);
        if (loc.province && loc.province !== loc.country) parts.push(loc.province);
        if (loc.city && loc.city !== loc.province) parts.push(loc.city);
        return parts.join(' · ');
      }

      function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

      function getSunsetHour(lat, lng, date) {
        const dayOfYear = getDayOfYear(date);
        const declination = 23.44 * Math.sin(2 * Math.PI * (dayOfYear - 81) / 365);
        const latRad = lat * Math.PI / 180;
        const decRad = declination * Math.PI / 180;
        const cosH = -Math.tan(latRad) * Math.tan(decRad);
        if (cosH < -1) return 24;
        if (cosH > 1) return 0;
        const H = Math.acos(cosH) * 180 / Math.PI;
        const sunsetSolar = 12 + H / 15;
        const sunsetBeijing = sunsetSolar + (120 - lng) / 15;
        return sunsetBeijing;
      }

      function loadRealRoute() {

              return;
            }
            const path = data.route.paths[0];
            const allCoords = [];
            path.steps.forEach(step => {
              if (step.polyline) {
                step.polyline.split(';').forEach(p => {
                  const [lng, lat] = p.split(',').map(Number);
                  if (!isNaN(lng) && !isNaN(lat)) {

            if (allCoords.length < 2) {

            new AMap.Polyline({
              path: allCoords,
              strokeColor: '#8fcbe8',
              strokeWeight: 5,
              strokeOpacity: 0.08,
              lineJoin: 'round',

          },
          zIndex: 300
        });
      }

      const nanchuanTextOffsetY = Math.round(IMG_SIZE / 2 + 16);
      const textToNanchuan = createArrivalTextBelow(NANCHUAN, '你想我们了吗？', '#e8a0b8', nanchuanTextOffsetY);
      textToNanchuan.setMap(map);

      const jiaxiangTextOffsetY = Math.round(IMG_SIZE / 2 + 16);
      const textToJiaxiang = createArrivalTextBelow(YANGTUN, '我想你们了', '#8fcbe8', jiaxiangTextOffsetY);
      textToJiaxiang.setMap(map);

      function showText(textObj, duration) {
        textObj.setStyle({ opacity: '1' });
        clearTimeout(textObj._hideTimer);
        textObj._hideTimer = setTimeout(() => {
          textObj.setStyle({ opacity: '0' });
        }, duration);
      }

      const DURATION = 4000;
      const PAUSE = 600;

      function flyMultiple(markersWithPath, duration) {
        return new Promise((resolve) => {
          const startTime = performance.now();

          function step(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / duration, 1);

            markersWithPath.forEach(item => {
              const p0Px = map.lngLatToContainer(new AMap.LngLat(item.p0[0], item.p0[1]));
              const p1Px = map.lngLatToContainer(new AMap.LngLat(item.p1[0], item.p1[1]));
              const p2Px = map.lngLatToContainer(new AMap.LngLat(item.p2[0], item.p2[1]));
              if (!p0Px || !p1Px || !p2Px) return;

              const px = bezierPoint(
                [p0Px.x, p0Px.y],
                [p1Px.x, p1Px.y],
                [p2Px.x, p2Px.y],
                t
              );

              const floatOffsetPx = Math.sin(t * Math.PI * 4) * 3;
              const lngLat = map.containerToLngLat(new AMap.Pixel(px[0], px[1] + floatOffsetPx));
              item.marker.setPosition([lngLat.getLng(), lngLat.getLat()]);
            });

            if (t < 1) {
              requestAnimationFrame(step);
            } else {
              resolve();
            }
          }
          requestAnimationFrame(step);
        });
      }

      function fadeOutMarkers(markers) {
        return new Promise((resolve) => {

              if (d) {

                d.style.transform = '';
                d.style.opacity = '';
              }
              done++;
              if (done === markers.length) resolve();
            }, 420);
          });
        });
      }

      let running = false;

      async function startLoop() {
        if (running) return;
        running = true;

        photoJX_A.hide(); photoJX_B.hide();
        photoNC_A.hide(); photoNC_B.hide();

        while (true) {
          photoJX_A.show();
          photoJX_B.show();
          [photoJX_A, photoJX_B].forEach(m => {
            const dom = m.getContentDom();
            if (dom) { dom.style.transform = ''; dom.style.opacity = ''; }

          await flyMultiple([
            { marker: photoJX_A, p0: YANGTUN, p1: ctrlA, p2: NANCHUAN },

          photoNC_A.show();

          [photoNC_A, photoNC_B].forEach(m => {

          await flyMultiple([

      }

      map.on('complete', () => {
        map.setFitView([nanchuanPhotoGroup, jiaxiangPhotoGroup], false, [100, 100, 100, 100]);
        setTimeout(() => {

        loadRealRoute();
        setTimeout(startLoop, 500);
      });

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          map.resize();
          map.setFitView([nanchuanPhotoGroup, jiaxiangPhotoGroup], false, [100, 100, 100, 100]);
        }, 200);
      });

      window.addEventListener('orientationchange', () => {
        setTimeout(() => {
          map.resize();
          map.setFitView([nanchuanPhotoGroup, jiaxiangPhotoGroup], false, [100, 100, 100, 100]);

  <!-- Live2D 初始化脚本 -->
  <script>
    (function () {
      "use strict";

      const MODEL_URL = "https://cdn.jsdelivr.net/gh/baicaiacabbge/baicaiclcy@main/baicai2d/object_live2d_020_101.asset.model3.json";

      // 台词按顺序循环播放，不再随机
      const MESSAGES = [
        "我们是好呀好朋友",
        "思念像一把小刀，一刀一刻一痕...",
        "也许这就是友谊吧",
        "今天又是想你的一天~",
        "陈柚柚&陈落落&天天开心",
        "誓言也许是如此吧"
      ];
      let messageIndex = 0;

      const widget = document.getElementById("live2d-widget");
      const canvas = document.getElementById("live2d-canvas");
      const bubble = document.getElementById("live2d-bubble");
      const statusEl = document.getElementById("l2d-status");
      const visibilityToggle = document.getElementById("l2d-visibility-toggle");
      const visibilityIcon = document.getElementById("l2d-visibility-icon");

      let app = null;
      let model = null;
      let bubbleTimer = 0;
      let idleTimer = 0;
      let isDragging = false;
      let dragStart = { x: 0, y: 0 };
      let dragOffset = { x: 0, y: 0 };

      const pointerFocus = {
        x: 0, y: 0,
        targetX: 0, targetY: 0,
        lastAt: 0
      };

      let mouthOpenUntil = 0;
      let blinkUntil = 0;
      let nextBlinkAt = performance.now() + 2400;

      window.__model = null;
      window.__playIdle = null;

      function initPixi() {
        app = new PIXI.Application({
          view: canvas,
          autoStart: true,
          backgroundAlpha: 0,
          antialias: false,
          autoDensity: true,
          resolution: Math.min(window.devicePixelRatio || 1, 1.5),
          resizeTo: widget
        });

        app.ticker.add(() => {
          if (!model) return;
          const core = model.internalModel && model.internalModel.coreModel;
          if (!core) return;

          const now = performance.now();
          const t = now / 1000;

          const fresh = now - pointerFocus.lastAt < 2600;
          const tx = fresh ? pointerFocus.targetX : 0;
          const ty = fresh ? pointerFocus.targetY : 0;

          pointerFocus.x += (tx - pointerFocus.x) * 0.16;
          pointerFocus.y += (ty - pointerFocus.y) * 0.16;

          try {
            core.setParameterValueById("ParamEyeBallX", pointerFocus.x * 0.7);
            core.setParameterValueById("ParamEyeBallY", -pointerFocus.y * 0.5);
            core.addParameterValueById("ParamAngleX", pointerFocus.x * 12, 0.5);
            core.addParameterValueById("ParamAngleY", -pointerFocus.y * 8, 0.5);
            core.addParameterValueById("ParamBodyAngleX", pointerFocus.x * 4, 0.35);

            core.setParameterValueById("ParamBreath", 0.5 + Math.sin(t * 1.25) * 0.18);
            core.addParameterValueById("ParamBodyAngleY", Math.sin(t * 0.34) * 0.35, 0.28);
            core.addParameterValueById("ParamBodyAngleZ", Math.sin(t * 0.42) * 0.26, 0.24);
            core.addParameterValueById("ParamAngleZ", Math.sin(t * 0.38) * 0.24, 0.2);

            const wispScale = 1.12;
            core.addParameterValueById("ParamWillOTheWhisp1X", Math.sin(t * 0.64) * 0.58 * wispScale, 0.12);
            core.addParameterValueById("ParamWillOTheWhisp1Y", Math.sin(t * 0.78 + 1.1) * 0.48 * wispScale, 0.12);
            core.addParameterValueById("ParamWillOTheWhisp2X", -Math.sin(t * 0.42 + 0.6) * 0.54 * wispScale, 0.12);
            core.addParameterValueById("ParamWillOTheWhisp2Y", Math.sin(t * 0.64) * 0.42 * wispScale, 0.12);
            core.addParameterValueById("ParamWillOTheWhisp3X", Math.sin(t * 0.78 + 1.1) * 0.52 * wispScale, 0.12);
            core.addParameterValueById("ParamWillOTheWhisp3Y", -Math.sin(t * 0.42 + 0.6) * 0.45 * wispScale, 0.12);

            core.addParameterValueById("ParamChainLShake", Math.sin(t * 0.64) * 0.44, 0.14);
            core.addParameterValueById("ParamChainRShake", Math.sin(t * 0.42 + 0.6) * 0.44, 0.14);

            if (now > nextBlinkAt) {
              blinkUntil = now + 140;
              nextBlinkAt = now + 2400 + Math.random() * 3200;
            }
            if (now < blinkUntil) {
              core.setParameterValueById("ParamEyeLOpen", 0.08);
              core.setParameterValueById("ParamEyeROpen", 0.08);
            }

            if (now < mouthOpenUntil) {
              core.setParameterValueById("ParamMouthOpenY", 1);
            }
          } catch (e) {}
        });

        return app;
      }

      async function loadModel() {
        statusEl.textContent = "模型加载中…";
        statusEl.style.color = "#8888a0";

        try {
          model = await PIXI.live2d.Live2DModel.from(MODEL_URL, {
            autoInteract: false
          });

          window.__model = model;

          app.stage.addChild(model);
          fitModel();

          statusEl.textContent = "Live2D Ready · Yuyuko";
          statusEl.style.color = "#6b7280";

          setTimeout(() => {
            playIdleMotion();
          }, 900);

          setTimeout(() => sayNext(), 900);
        } catch (err) {
          statusEl.textContent = "加载失败";
          statusEl.style.color = "#f87171";
        }
      }

      function getMotionDuration(motion) {
        if (!motion || !motion.Motion) return 3000;
        const curves = motion.Motion.Curves || [];
        let maxTime = 0;
        for (const curve of curves) {
          const segments = curve.Segments || [];
          for (let i = 0; i < segments.length; i += 3) {
            if (typeof segments[i] === "number" && segments[i] > maxTime) {
              maxTime = segments[i];
            }
          }
        }
        return maxTime > 0 ? maxTime * 1000 : 3000;
      }

      function playIdleMotion() {
        if (!model) return;

        const motions = model.internalModel.settings.motions;
        const groups = Object.keys(motions || {});
        if (!groups.length) return;

        const group = groups.includes("Idle") ? "Idle" : groups[0];
        const list = motions[group];
        if (!list || !list.length) return;

        const index = Math.floor(Math.random() * list.length);

        try {
          const mm = model.internalModel.motionManager;
          mm.startMotion(group, index);

          const duration = getMotionDuration(list[index]);
          clearTimeout(idleTimer);
          idleTimer = setTimeout(playIdleMotion, Math.max(1200, duration * 0.85));
        } catch (e) {
          clearTimeout(idleTimer);
          idleTimer = setTimeout(playIdleMotion, 3000);
        }
      }

      window.__playIdle = playIdleMotion;

      function fitModel() {
        if (!model || !app) return;

        model.scale.set(1);
        model.position.set(0, 0);

        const sw = app.screen.width;
        const sh = app.screen.height;
        const bounds = model.getLocalBounds();
        const mw = Math.max(bounds.width, 1);
        const mh = Math.max(bounds.height, 1);
        const scale = Math.min((sw * 0.92) / mw, (sh * 0.95) / mh);

        model.scale.set(scale);
        model.position.set(
          sw / 2 - (bounds.x + bounds.width / 2) * scale,
          sh / 2 - (bounds.y + bounds.height / 2) * scale
        );
      }

      function onModelTap() {
        sayNext();
        mouthOpenUntil = performance.now() + 600;
        playIdleMotion();
      }

      // 按顺序播放台词
      function sayNext() {
        const text = MESSAGES[messageIndex];
        messageIndex = (messageIndex + 1) % MESSAGES.length;

        bubble.textContent = text;
        bubble.classList.add("show");

        requestAnimationFrame(() => {
          const rect = bubble.getBoundingClientRect();
          if (rect.left < 8) {
            bubble.style.left = (8 - rect.left) + "px";
          } else {
            bubble.style.left = "0";
          }
        });

        clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(() => bubble.classList.remove("show"), 3200);
      }

      window.addEventListener("pointermove", (e) => {
        const w = window.innerWidth;
        const h = window.innerHeight;

        pointerFocus.targetX = Math.max(-1, Math.min(1, (e.clientX / w - 0.5) * 2));
        pointerFocus.targetY = Math.max(-1, Math.min(1, (e.clientY / h - 0.5) * 2));
        pointerFocus.lastAt = performance.now();

        if (model && typeof model.focus === "function") {
          try { model.focus(e.clientX, e.clientY); } catch (err) {}
        }
      });

      canvas.addEventListener("pointerdown", (e) => {
        isDragging = false;
        const rect = widget.getBoundingClientRect();
        dragOffset.x = e.clientX - rect.left;
        dragOffset.y = e.clientY - rect.top;
        dragStart.x = e.clientX;
        dragStart.y = e.clientY;

        widget.classList.add("dragging");
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!widget.classList.contains("dragging")) return;

        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) isDragging = true;

        const x = e.clientX - dragOffset.x;
        const y = e.clientY - dragOffset.y;
        const maxX = window.innerWidth - widget.offsetWidth;
        const maxY = window.innerHeight - widget.offsetHeight;

        widget.style.left = Math.max(0, Math.min(x, maxX)) + "px";
        widget.style.top = Math.max(0, Math.min(y, maxY)) + "px";
        widget.style.bottom = "auto";
      });

      canvas.addEventListener("pointerup", (e) => {
        const wasDragging = isDragging;

        widget.classList.remove("dragging");
        try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}

        isDragging = false;

        if (!wasDragging) {
          onModelTap();
        }
      });

      function syncVisibilityButton() {
        const isHidden = widget.classList.contains("hidden");
        if (isHidden) {
          visibilityToggle.classList.add("model-hidden");
          visibilityToggle.title = "显示模型";
          visibilityIcon.className = "fa-solid fa-eye-slash";
        } else {
          visibilityToggle.classList.remove("model-hidden");
          visibilityToggle.title = "隐藏模型";
          visibilityIcon.className = "fa-solid fa-eye";
        }
      }

      visibilityToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        widget.classList.toggle("hidden");
        syncVisibilityButton();
      });

      syncVisibilityButton();

      window.addEventListener("resize", () => {
        fitModel();
      });

      window.addEventListener("load", () => {
        if (!window.PIXI || !PIXI.live2d) {
          statusEl.textContent = "依赖加载失败，请刷新";
          return;
        }
        initPixi();
        loadModel();
      });
    })();
