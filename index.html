<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我们</title>
  <link rel="icon" type="image/jpeg" href="3.jpeg">
  <script>
    window._AMapSecurityConfig = {
      securityJsCode: "8bf8a3e5628e6b4f0f8a9f1a8a8dc097"
    };
  </script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=c4165df92b1f624f44e932659ad0920e&plugin=AMap.GeoJSON,AMap.Text,AMap.Marker,AMap.BezierCurve,AMap.Polyline"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
      background-color: #0d141c;
    }

    :root {
      --page-bg: #0d141c;
      --text-main: #e0e8f0;
      --text-sub: #98a8b8;
      --text-shadow: rgba(0, 0, 0, 0.75);
      --season-accent: #e8a0b8;
      --season-accent-2: #f5c6d6;
      --season-glow: rgba(232, 160, 184, 0.5);
    }

    body.season-spring {
      --season-accent: #e8a0b8;
      --season-accent-2: #f5c6d6;
      --season-glow: rgba(232, 160, 184, 0.5);
    }
    body.season-summer {
      --season-accent: #4a9fd4;
      --season-accent-2: #8fcbe8;
      --season-glow: rgba(74, 159, 212, 0.5);
    }
    body.season-autumn {
      --season-accent: #d98a3d;
      --season-accent-2: #f0bd7c;
      --season-glow: rgba(217, 138, 61, 0.5);
    }
    body.season-winter {
      --season-accent: #8fa8c4;
      --season-accent-2: #c8d8e8;
      --season-glow: rgba(143, 168, 196, 0.5);
    }

    /* 过渡层 */
    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d141c;
      user-select: none;
      pointer-events: none;
      animation: introAutoFade 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes introAutoFade {
      0%   { opacity: 0; }
      10%  { opacity: 1; }
      65%  { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    .intro-title {
      font-size: 20px;
      font-weight: 400;
      color: #e0e8f0;
      letter-spacing: 8px;
      text-indent: 8px;
      opacity: 0;
      font-family: 'Noto Serif SC', 'Microsoft YaHei', serif;
      animation: introTextIn 1.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    .intro-sub {
      font-size: 11px;
      color: #6b7a8a;
      letter-spacing: 4px;
      text-indent: 4px;
      opacity: 0;
      margin-top: 12px;
      animation: introTextIn 1.8s cubic-bezier(0.2, 0.8, 0.3, 1) 0.15s forwards;
    }

    @keyframes introTextIn {
      0%   { opacity: 0; transform: translateY(6px); filter: blur(4px); }
      40%  { opacity: 1; transform: translateY(0); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* 主内容 */
    #main-content {
      opacity: 0;
      animation: mainContentIn 1s cubic-bezier(0.2, 0.8, 0.3, 1) 1s forwards;
    }

    @keyframes mainContentIn {
      0%   { opacity: 0; }
      100% { opacity: 1; }
    }

    #amap-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
    }

    #watermark-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 2;
      pointer-events: none;
      background-repeat: repeat;
      background-size: 180px 120px;
      user-select: none;
      will-change: transform, opacity;
      animation: watermarkDrift 60s linear infinite,
                 watermarkBreathe 12s ease-in-out infinite;
    }

    @keyframes watermarkDrift {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-40px, -20px); }
      50%  { transform: translate(-80px, 0); }
      75%  { transform: translate(-40px, 20px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes watermarkBreathe {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.55; }
    }

    .amap-logo,
    .amap-copyright {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* ============================================================
       右上角信息面板
       ============================================================ */
    .info-panel {
      position: fixed;
      right: 16px;
      top: 14px;
      z-index: 999;
      text-align: right;
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      pointer-events: none;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-shadow:
        0 1px 2px var(--text-shadow),
        0 0 6px var(--text-shadow);
    }

    .info-panel .info-ip {
      display: block;
      font-size: 12px;
      color: var(--text-main);
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .info-panel .info-location {
      display: block;
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
      margin-top: 2px;
    }

    .info-panel .info-code {
      display: block;
      font-size: 12px;
      color: var(--text-main);
      font-weight: 600;
      font-family: 'Consolas', 'Monaco', 'Menlo', monospace;
      letter-spacing: 0.5px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    /* ============================================================
       认识时长
       ============================================================ */
    .info-panel .info-together {
      display: block;
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      line-height: 1.7;
      letter-spacing: 0.2px;
    }

    .info-panel .info-together .tg-name {
      color: var(--text-main);
      font-weight: 600;
      margin-right: 4px;
    }

    .info-panel .info-together .tg-time {
      font-family: 'Consolas', 'Monaco', 'Menlo', monospace;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
      font-weight: 600;
    }

    .bottom-right-stack {
      position: fixed;
      right: 16px;
      bottom: 14px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: none;
      user-select: none;
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-shadow:
        0 1px 2px var(--text-shadow),
        0 0 6px var(--text-shadow);
    }

    .audio-btn {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-sub);
      letter-spacing: 0.3px;
      transition: color 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    .audio-btn:hover {
      color: var(--text-main);
    }

    .audio-btn:active {
      transform: scale(0.96);
    }

    .audio-btn .audio-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      font-size: 12px;
      line-height: 1;
    }

    .audio-btn.playing .audio-icon::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--season-accent);
      animation: audioPulse 1.2s ease-in-out infinite;
      box-shadow: 0 0 6px var(--season-accent);
    }

    .audio-btn:not(.playing) .audio-icon::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.6;
    }

    @keyframes audioPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.6); opacity: 0.7; }
    }

    .audio-hint {
      font-size: 10.5px;
      color: var(--text-sub);
      opacity: 0;
      transition: opacity 0.4s ease;
      letter-spacing: 0.3px;
      pointer-events: none;
      white-space: nowrap;
    }

    .audio-hint.show {
      opacity: 0.75;
    }

    .custom-copyright {
      font-size: 12px;
      color: var(--text-main);
      font-weight: 600;
      letter-spacing: 0.4px;
      white-space: nowrap;
      text-align: right;
      line-height: 1.6;
    }

    .custom-copyright .time-text {
      display: block;
      color: var(--text-sub);
      font-weight: 500;
      font-size: 11.5px;
    }

    .map-weather {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 8px;
      background: rgba(30, 40, 50, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      white-space: nowrap;
    }

    .map-weather .mw-icon {
      font-size: 14px;
      line-height: 1;
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
    }

    .map-weather .mw-temp {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }

    .map-weather .mw-desc {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-sub);
      margin-left: 2px;
    }

    .distance-block {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 12px;
      border-radius: 14px;
      background: rgba(30, 40, 50, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
      font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      white-space: nowrap;
    }

    .distance-block .db-distance {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .distance-block .db-daynight {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-sub);
      letter-spacing: 0.2px;
    }

    .image-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 15, 22, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      cursor: zoom-out;
    }

    .image-viewer.show {
      opacity: 1;
      visibility: visible;
    }

    .image-viewer img {
      max-width: 82vw;
      max-height: 82vh;
      border-radius: 12px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
      transform: scale(0.92);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
      object-fit: contain;
    }

    .image-viewer.show img {
      transform: scale(1);
    }

    .arrival-glow {
      position: fixed;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 500;
      background: radial-gradient(circle, var(--season-glow) 0%, transparent 70%);
      transform: translate(-50%, -50%) scale(0.3);
      opacity: 0;
      animation: glowPop 1.1s ease-out forwards;
    }

    @keyframes glowPop {
      0%   { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
      30%  { opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
    }

    .trail-dot {
      position: fixed;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 240;
      transform: translate(-50%, -50%);
      opacity: 0;
      animation: trailFade 0.9s ease-out forwards;
    }

    @keyframes trailFade {
      0%   { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    }

    @media (max-width: 768px) {
      .intro-title {
        font-size: 16px;
        letter-spacing: 6px;
        text-indent: 6px;
      }
      .intro-sub {
        font-size: 10px;
        letter-spacing: 3px;
        text-indent: 3px;
      }
      .info-panel {
        right: 12px;
        top: 10px;
      }
      .info-panel .info-ip {
        font-size: 11px;
      }
      .info-panel .info-location {
        font-size: 10px;
      }
      .info-panel .info-code {
        font-size: 11px;
      }
      .info-panel .info-together {
        font-size: 10px;
        margin-top: 6px;
        padding-top: 5px;
        line-height: 1.6;
      }
      .bottom-right-stack {
        right: 12px;
        bottom: 10px;
      }
      .audio-btn {
        font-size: 11px;
      }
      .audio-hint {
        font-size: 10px;
      }
      .custom-copyright {
        font-size: 11px;
      }
      .custom-copyright .time-text {
        font-size: 10.5px;
      }
      #watermark-layer {
        background-size: 140px 94px;
      }
      .arrival-glow {
        width: 60px;
        height: 60px;
      }
      .map-weather {
        padding: 2px 8px;
        gap: 4px;
      }
      .map-weather .mw-icon {
        font-size: 12px;
        width: 14px;
        height: 14px;
      }
      .map-weather .mw-temp {
        font-size: 11px;
      }
      .map-weather .mw-desc {
        font-size: 10px;
      }
      .distance-block {
        padding: 4px 10px;
        gap: 2px;
      }
      .distance-block .db-distance {
        font-size: 11px;
      }
      .distance-block .db-daynight {
        font-size: 10px;
      }
    }
  </style>
</head>
<body class="season-spring">

  <div id="intro-overlay">
    <div class="intro-title">南川 · 嘉祥</div>
    <div class="intro-sub">We</div>
  </div>

  <div id="main-content">
    <div id="amap-container"></div>
    <div id="watermark-layer"></div>

    <div class="info-panel">
      <span class="info-ip" id="infoIp">IP 获取中...</span>
      <span class="info-location" id="infoLocation">位置获取中...</span>
      <span class="info-code" id="infoCode">CN_--------</span>
      <span class="info-together">
        <span class="tg-name">陈柚柚</span><span class="tg-time" id="tgYouyou">--</span><br>
        <span class="tg-name">陈落落</span><span class="tg-time" id="tgLuoluo">--</span>
      </span>
    </div>

    <div class="bottom-right-stack">
      <div class="audio-hint" id="audioHint">点击任意位置开启音乐</div>
      <div class="audio-btn" id="audioBtn" title="点击播放/暂停背景音乐">
        <span class="audio-icon" id="audioIcon"></span>
        <span id="audioLabel">播放音乐</span>
      </div>
      <div class="custom-copyright">
        <span id="copyrightText"></span>
        <span class="time-text" id="timeText"></span>
      </div>
    </div>

    <div class="image-viewer" id="imageViewer">
      <img id="imageViewerImg" src="" alt="">
    </div>

    <audio id="bgAudio" src="https://videotourl.com/audio/1789199120813-c54b5c8b-4697-4bcb-8902-3329b8f2f34d.mp3" loop preload="auto"></audio>
  </div>

  <script>
    (function() {
      // ============================================================
      // 接口配置
      // ============================================================
      const WEATHER_ENABLED = true;
      const WEATHER_KEY = '9e38f0bc62f8fe0d';
      const WEATHER_API = 'https://api.auth.top/api/weather';

      const IP_GET_API = 'https://api.auth.top/api/getip';
      const IP_INFO_API = 'https://api.auth.top/api/ip';
      const API_KEY = '9e38f0bc62f8fe0d';

      const CITY_NANCHUAN = '南川区';
      const CITY_JIAXIANG = '嘉祥县';

      const NANCHUAN = [107.10, 29.15];
      const YANGTUN = [116.35, 35.4819];

      // ============================================================
      // 【新增】认识时长计算
      // 陈柚柚：从 2025 年 7 月 1 日起
      // 陈落落：从 2026 年 8 月 2 日起
      // 格式：
      //   未满 1 年：X 天 X 时 X 分 X 秒
      //   满 1 年：第 N 年 X 天 X 时 X 分 X 秒
      // ============================================================
      const TG_YOUYOU_START = new Date(2025, 6, 1, 0, 0, 0);   // 2025-07-01 00:00:00
      const TG_LUOLUO_START = new Date(2026, 7, 2, 0, 0, 0);   // 2026-08-02 00:00:00

      function formatTogether(startDate) {
        const now = new Date();
        let diff = now.getTime() - startDate.getTime();
        if (diff < 0) diff = 0;

        // 计算总天数
        const totalDays = Math.floor(diff / 86400000);

        // 计算年数：从起始日期开始，每年同月同日为一年
        let years = now.getFullYear() - startDate.getFullYear();
        // 检查今年的纪念日是否已过
        const thisYearAnniv = new Date(
          startDate.getFullYear() + years,
          startDate.getMonth(),
          startDate.getDate(),
          startDate.getHours(),
          startDate.getMinutes(),
          startDate.getSeconds()
        );
        if (now < thisYearAnniv) years--;

        // 计算剩余天数（从最近一次周年日算起）
        let remainderMs;
        if (years >= 1) {
          const lastAnniv = new Date(
            startDate.getFullYear() + years,
            startDate.getMonth(),
            startDate.getDate(),
            startDate.getHours(),
            startDate.getMinutes(),
            startDate.getSeconds()
          );
          remainderMs = now.getTime() - lastAnniv.getTime();
        } else {
          remainderMs = diff;
        }

        const days = Math.floor(remainderMs / 86400000);
        const hours = Math.floor((remainderMs % 86400000) / 3600000);
        const minutes = Math.floor((remainderMs % 3600000) / 60000);
        const seconds = Math.floor((remainderMs % 60000) / 1000);

        if (years >= 1) {
          return `第${years}年 ${days}天 ${hours}时 ${minutes}分 ${seconds}秒`;
        }
        return `${totalDays}天 ${hours}时 ${minutes}分 ${seconds}秒`;
      }

      function updateTogether() {
        const youyouEl = document.getElementById('tgYouyou');
        const luoluoEl = document.getElementById('tgLuoluo');
        if (youyouEl) youyouEl.textContent = '· ' + formatTogether(TG_YOUYOU_START);
        if (luoluoEl) luoluoEl.textContent = '· ' + formatTogether(TG_LUOLUO_START);
      }

      updateTogether();
      setInterval(updateTogether, 1000);

      // ============================================================
      // 音频自动播放 + 提示
      // ============================================================
      const bgAudio = document.getElementById('bgAudio');
      const audioBtn = document.getElementById('audioBtn');
      const audioLabel = document.getElementById('audioLabel');
      const audioHint = document.getElementById('audioHint');

      let audioPlaying = false;
      let userPaused = false;
      let autoPlayAttempted = false;

      function updateAudioUI(playing) {
        audioPlaying = playing;
        if (playing) {
          audioBtn.classList.add('playing');
          audioLabel.textContent = '暂停音乐';
          audioHint.classList.remove('show');
        } else {
          audioBtn.classList.remove('playing');
          audioLabel.textContent = '播放音乐';
        }
      }

      function tryAutoPlay() {
        if (autoPlayAttempted) return;
        autoPlayAttempted = true;
        if (userPaused) return;

        bgAudio.play().then(() => {
          updateAudioUI(true);
        }).catch(err => {
          console.log('自动播放被拦截:', err.message);
          audioHint.classList.add('show');
        });
      }

      setTimeout(tryAutoPlay, 2000);

      function onUserInteraction(e) {
        if (e && e.target && e.target.closest && e.target.closest('#audioBtn')) {
          return;
        }
        if (!audioPlaying && !userPaused) {
          bgAudio.play().then(() => {
            updateAudioUI(true);
          }).catch(err => {});
        }
      }

      document.addEventListener('click', onUserInteraction);
      document.addEventListener('touchstart', onUserInteraction, { passive: true });
      document.addEventListener('keydown', onUserInteraction);

      audioBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (audioPlaying) {
          userPaused = true;
          bgAudio.pause();
          updateAudioUI(false);
        } else {
          userPaused = false;
          bgAudio.play().then(() => {
            updateAudioUI(true);
          }).catch(err => {
            console.warn('音频播放失败:', err);
          });
        }
      });

      bgAudio.addEventListener('ended', () => {
        updateAudioUI(false);
      });

      // ============================================================
      // 季节主题
      // ============================================================
      function applySeasonTheme() {
        const month = new Date().getMonth() + 1;
        let season = 'spring';
        if (month >= 3 && month <= 5) season = 'spring';
        else if (month >= 6 && month <= 8) season = 'summer';
        else if (month >= 9 && month <= 11) season = 'autumn';
        else season = 'winter';

        document.body.classList.remove('season-spring', 'season-summer', 'season-autumn', 'season-winter');

      async function fetchVisitorIP() {

            headers: {
              'Authorization': 'Bearer ' + API_KEY,
              'Content-Type': 'application/x-www-form-urlencoded'
            },

          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const ip = data.ip || (data.data && data.data.ip);
          if (data.code !== 0 || !ip) return null;
          return ip;
        } catch (err) {
          return null;
        }
      }

      async function fetchIPLocation(ip) {
        try {
          const res = await fetch(IP_INFO_API, {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + API_KEY,
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: 'ip=' + encodeURIComponent(ip) + '&format=json'
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          if (data.code !== 0) return null;
          const loc = data.data || data;
          return {
            country: loc.country || '',
            province: loc.province || '',
            city: loc.city || ''
          };
        } catch (err) {
          return null;
        }
      }

        if (!loc) return '';
        const parts = [];
        if (loc.country) parts.push(loc.country);
        if (loc.province && loc.province !== loc.country) parts.push(loc.province);
        if (loc.city && loc.city !== loc.province) parts.push(loc.city);
        return parts.join(' · ');
      }

      function calcDistance(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }

        const decRad = declination * Math.PI / 180;
        const cosH = -Math.tan(latRad) * Math.tan(decRad);
        if (cosH < -1) return 24;
        if (cosH > 1) return 0;
        const H = Math.acos(cosH) * 180 / Math.PI;
        const sunsetSolar = 12 + H / 15;
        const sunsetBeijing = sunsetSolar + (120 - lng) / 15;
        return sunsetBeijing;
      }

      function bezierPoint(p0, p1, p2, t) {
        const mt = 1 - t;
        return [
          mt * mt * p0[0] + 2 * mt * t * p1[0] + t * t * p2[0],
          mt * mt * p0[1] + 2 * mt * t * p1[1] + t * t * p2[1]

      function showText(textObj, duration) {

        clearTimeout(textObj._hideTimer);
        textObj._hideTimer = setTimeout(() => {

      const DURATION = 4000;
      const PAUSE = 600;

      const TRAIL_COLOR_A = 'rgba(232, 160, 184, 0.7)';
      const TRAIL_COLOR_B = 'rgba(143, 203, 232, 0.7)';

      function flyMultiple(markersWithPath, duration, trailColor) {
        return new Promise((resolve) => {
          const startTime = performance.now();
          let lastTrailTime = 0;
          const TRAIL_INTERVAL = 55;

          function step(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / duration, 1);

            markersWithPath.forEach(item => {
              const pos = bezierPoint(item.p0, item.p1, item.p2, t);
              const floatOffset = Math.sin(t * Math.PI * 4) * 0.008;
              const floatPos = [pos[0], pos[1] + floatOffset];
              item.marker.setPosition(floatPos);

              if (trailColor && now - lastTrailTime > TRAIL_INTERVAL && t < 0.98) {
                spawnTrailDot(pos, trailColor);
              }
            });

            if (now - lastTrailTime > TRAIL_INTERVAL) {
              lastTrailTime = now;
            }

            if (t < 1) {
              requestAnimationFrame(step);
            } else {
              resolve();
            }
          }
          requestAnimationFrame(step);
        });
      }

      function fadeOutMarkers(markers) {
        return new Promise((resolve) => {
          let done = 0;
          markers.forEach(marker => {
            const dom = marker.getContentDom();
            if (dom) {
              dom.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
              dom.style.transform = 'scale(0.4)';
              dom.style.opacity = '0';
            }
            setTimeout(() => {
              marker.hide();
              const d = marker.getContentDom();
              if (d) {
                d.style.transition = '';
                d.style.transform = '';
                d.style.opacity = '';
              }
              done++;
              if (done === markers.length) resolve();
            }, 420);
          });
        });
      }

          photoJX_A.show();
          photoJX_B.show();
          [photoJX_A, photoJX_B].forEach(m => {
            const dom = m.getContentDom();
            if (dom) { dom.style.transform = ''; dom.style.opacity = ''; }
          });

          await flyMultiple([
            { marker: photoJX_A, p0: YANGTUN, p1: ctrlA, p2: NANCHUAN },
            { marker: photoJX_B, p0: YANGTUN, p1: ctrlB, p2: NANCHUAN }
          ], DURATION, TRAIL_COLOR_A);

          spawnArrivalGlow(NANCHUAN);
          await fadeOutMarkers([photoJX_A, photoJX_B]);
          showText(textToNanchuan, 2000);
          await new Promise(r => setTimeout(r, PAUSE + 2000));

          photoNC_A.show();
          photoNC_B.show();
          [photoNC_A, photoNC_B].forEach(m => {
            const dom = m.getContentDom();
            if (dom) { dom.style.transform = ''; dom.style.opacity = ''; }
          });

          await flyMultiple([
            { marker: photoNC_A, p0: NANCHUAN, p1: ctrlA, p2: YANGTUN },
            { marker: photoNC_B, p0: NANCHUAN, p1: ctrlB, p2: YANGTUN }
          ], DURATION, TRAIL_COLOR_B);

          spawnArrivalGlow(YANGTUN);
          await fadeOutMarkers([photoNC_A, photoNC_B]);
          showText(textToJiaxiang, 2000);
          await new Promise(r => setTimeout(r, PAUSE + 2000));
        }
      }

      map.on('complete', () => {
        map.setFitView([nanchuanPhotoGroup, jiaxiangPhotoGroup], false, [100, 100, 100, 100]);
        setTimeout(() => {
          const zoom = map.getZoom();
          if (zoom > 6) map.setZoom(zoom - 0.5);
        }, 200);
        setTimeout(startLoop, 500);
      });

      let resizeTimer = null;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          map.resize();
          map.setFitView([nanchuanPhotoGroup, jiaxiangPhotoGroup], false, [100, 100, 100, 100]);
        }, 200);
      });

      window.addEventListener('orientationchange', () => {
        setTimeout(() => {
          map.resize();
          map.setFitView([nanchuanPhotoGroup, jiaxiangPhotoGroup], false, [100, 100, 100, 100]);
        }, 300);
      });

    })();
  </script>
</body>
</html>
